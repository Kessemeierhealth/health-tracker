name: healthtracker
description: "HealthTracker – Persönlicher Gesundheitsassistent für Einzelpersonen und Familien."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Persistenz (Datenbank & Einstellungen)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Technische ID-Erzeugung
  uuid: ^4.5.1

  # UI / Helpers
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code-Generierung für Isar
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true

  # Hier können später Assets (Bilder, Icons) oder Schriftarten registriert werden:
  # assets:
  #   - assets/images/
